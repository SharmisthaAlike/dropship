[package]
name = "dropship"
version = "0.1.0"
edition = "2021"
description = "Peer-to-peer file transfer over asynchronous TCP"
license = "MIT"
repository = "https://github.com/sharmisthaa/dropship"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "io-util"] }